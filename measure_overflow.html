<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Arquimago Overflow Measure</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: monospace; }
  #out { padding: 12px; font-size: 13px; white-space: pre; }
  iframe { width: 100vw; height: 100vh; border: 0; }
</style>
</head>
<body>
<div id="out">measuring…</div>
<script>
  var results = [];
  var size = (location.search || "?375").replace("?", "");
  var m = size.match(/(\d+)x(\d+)/);
  var w = m ? parseInt(m[1], 10) : parseInt(size, 10);
  var h = m ? parseInt(m[2], 10) : 812;
  document.body.style.overflow = "hidden";
  window.resizeTo(w, h);
  var iframe = document.createElement("iframe");
  iframe.style.width = w + "px";
  iframe.style.height = h + "px";
  iframe.src = "http://localhost:8765/index.html";
  document.body.appendChild(iframe);

  var out = document.getElementById("out");
  function report(tag) {
    try {
      var d = iframe.contentDocument;
      var win = iframe.contentWindow;
      var body = d.body;
      var game = d.getElementById("game");
      var topbar = d.querySelector(".topbar");
      var tabBar = d.querySelector(".main-tabs");
      var lines = [];
      lines.push("TAG: " + tag + "  viewport=" + w + "x" + h);
      lines.push("window.innerWidth     = " + window.innerWidth);
      lines.push("iframe.contentWindow.innerWidth = " + win.innerWidth);
      lines.push("document.scrollWidth  = " + d.documentElement.scrollWidth);
      lines.push("document.body.scrollWidth = " + body.scrollWidth);
      lines.push("body.clientWidth      = " + body.clientWidth);
      if (game) {
        lines.push("game.offsetWidth      = " + game.offsetWidth + "  scrollWidth=" + game.scrollWidth);
        lines.push("game.scrollWidth-gt-client? " + (game.scrollWidth > game.clientWidth + 1));
      }
      if (topbar) {
        var tw = topbar.scrollWidth, tcw = topbar.clientWidth;
        lines.push("topbar.offsetWidth    = " + topbar.offsetWidth + "  scrollW=" + tw + "  clientW=" + tcw + "  overflow=" + (tw > tcw + 1));
        var kids = topbar.children;
        var kt = [];
        for (var i = 0; i < kids.length; i++) kt.push(kids[i].className + ":" + kids[i].offsetWidth + "/" + kids[i].scrollWidth);
        lines.push("topbar children: " + kt.join(" "));
      }
      if (tabBar) {
        var tw2 = tabBar.scrollWidth, tcw2 = tabBar.clientWidth;
        lines.push("tabs.offsetWidth      = " + tabBar.offsetWidth + "  scrollW=" + tw2 + "  clientW=" + tcw2 + "  overflow=" + (tw2 > tcw2 + 1));
      }
      var maxScroll = 0;
      d.querySelectorAll("*").forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.right > maxScroll) maxScroll = r.right;
      });
      lines.push("max element right edge= " + Math.round(maxScroll) + " (viewport " + w + ")");
      lines.push("body children widths: " + Array.prototype.map.call(body.children, function (c) { return c.id || c.className; }).join(" | "));
      lines.push("game children widths: " + (game ? Array.prototype.map.call(game.children, function (c) { return c.className + ":" + c.offsetWidth; }).join(" ") : "n/a"));
      out.textContent = lines.join("\n");
    } catch (e) {
      out.textContent = "TAG: " + tag + "  ERROR: " + e.message;
    }
  }

  iframe.onload = function () {
    setTimeout(function () { report("after-load"); }, 1800);
    setTimeout(function () { report("after-3s"); }, 3500);
  };
</script>
</body>
</html>
